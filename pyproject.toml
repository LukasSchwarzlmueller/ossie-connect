[project]
name = "ossie-connect"
version = "0.1.0"
description = "Upload and download Apache Ossie semantic models to Microsoft Fabric and Databricks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    # Nothing here has run against a real workspace yet - see "Status" in the README.
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
# The apache-ossie converters are not on PyPI, so they are named here as PEP 508 direct
# references rather than only in [tool.uv.sources]. Sources are project-local and do not
# travel with the built wheel, which makes the package uninstallable for anyone else -
# including a models repo depending on this by git URL. Direct references do travel.
# They also mean this package cannot be uploaded to PyPI until the converters are.
dependencies = [
    "apache-ossie-microsoft @ git+https://github.com/apache/ossie-converters@853c52986cd03508fe233fbab8c4213890943095#subdirectory=microsoft",
    "apache-ossie-databricks @ git+https://github.com/apache/ossie@a5bdbbcd981c3dfb93f99ba8221602e1c3108f8c#subdirectory=converters/databricks",
    "databricks-sdk>=0.133.0",
    "pyyaml",
]

[project.optional-dependencies]
# Snowflake is optional: its connector is heavy and the Snowflake path is upload-only.
snowflake = [
    "apache-ossie-snowflake @ git+https://github.com/apache/ossie-converters@853c52986cd03508fe233fbab8c4213890943095#subdirectory=snowflake",
    "snowflake-connector-python>=4.7.2",
]

[project.scripts]
ossie-connect = "ossie_connect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the git direct references in [project.dependencies] above.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ossie_connect"]
# py.typed ships the inline annotations, so a consumer type-checking against
# SupportsUpload / SupportsDownload actually sees them.
artifacts = ["src/ossie_connect/py.typed"]

[tool.uv.sources]
# Pinned, not floating. Upstream split into two repos on 2026-10-21: apache/ossie keeps
# the spec and core package, apache/ossie-converters holds one top-level folder per
# converter and carries apache/ossie as its `ossie/` submodule. Core comes from that
# submodule, so one ossie-converters rev bumps core and converters together, to the pair
# upstream tests. Two reasons the pins cannot simply be bumped:
#  - The Java Databricks converter is built from this same rev (_java.CONVERTERS_REV,
#    kept equal by a test), so a bump changes both. The Python Databricks converter,
#    now only the fallback when no jar is built, was removed upstream before the split
#    and stays on an old apache/ossie commit (it depends only on pyyaml, so no conflict).
#  - _fabric_api reuses three private helpers of ossie_microsoft.engine, which a bump
#    could rename. tests/test_ossie_connect.py exercises all three.
apache-ossie = { git = "https://github.com/apache/ossie-converters", subdirectory = "ossie/python", rev = "853c52986cd03508fe233fbab8c4213890943095" }
apache-ossie-microsoft = { git = "https://github.com/apache/ossie-converters", subdirectory = "microsoft", rev = "853c52986cd03508fe233fbab8c4213890943095" }
apache-ossie-databricks = { git = "https://github.com/apache/ossie", subdirectory = "converters/databricks", rev = "a5bdbbcd981c3dfb93f99ba8221602e1c3108f8c" }
apache-ossie-snowflake = { git = "https://github.com/apache/ossie-converters", subdirectory = "snowflake", rev = "853c52986cd03508fe233fbab8c4213890943095" }

[dependency-groups]
dev = ["pytest>=8"]
